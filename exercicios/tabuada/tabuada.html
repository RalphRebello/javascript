<!DOCTYPE html>
<html lang="pt-BR">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modelo de Exercício</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Tabuada</h1>
    </header>
    <section>
      <div id="dados">
        <p>

        </select>
      </div>
    </section>
    <footer>
      <p>&copy; Tabuada Industries</p>
    </footer>
    <script src="script.js"></script>
  </body>
</html>
